name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -name settings.gradle -exec dirname {} \; > project_path.txt
          echo "Project folder found"

      - name: Build APK
        run: |
          cd "$(head -n 1 project_path.txt)"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeraRozKaHisaab-APK
          path: project/**/build/outputs/apk/debug/*.apk
